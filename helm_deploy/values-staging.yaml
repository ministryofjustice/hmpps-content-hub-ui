---
# Per environment values which override defaults in hmpps-content-hub-ui/values.yaml

generic-service:
  replicaCount: 2

  ingress:
    hosts:
      - content-hub-staging.hmpps.service.justice.gov.uk
      - staff.content-hub-staging.hmpps.service.justice.gov.uk

  env:
    INGRESS_URL: "https://content-hub-staging.hmpps.service.justice.gov.uk"
    HMPPS_AUTH_URL: "https://sign-in-dev.hmpps.service.justice.gov.uk/auth"
    LAUNCHPAD_AUTH_URL: "https://launchpad-auth-dev.hmpps.service.justice.gov.uk"
    TOKEN_VERIFICATION_API_URL: "https://token-verification-api-dev.prison.service.justice.gov.uk"
    ENVIRONMENT_NAME: STAGING
    AUDIT_ENABLED: "false"
    NPR_STREAM_URL: "https://proxy-prisoner-content-hub-staging.apps.live.cloud-platform.service.justice.gov.uk/npr-live/stream.ogg"

  # Disable audit and need for audit setup in staging
  namespace_secrets.sqs-hmpps-audit-secret: null
  namespace_secrets.sqs-hmpps-prisoner-audit-secret: null

generic-prometheus-alerts:
  alertSeverity: hmpps-launchpad-nonprod
